<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            background: black;
            overflow: hidden;
            position: relative;
            display: grid;
            place-content: center;
        }

        canvas {
            width: 900px;
            aspect-ratio: 1/1;
            background: blue;
            border: 5px solid red;
        }

        .holder {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translate(-40%);
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            gap: 10px;
        }

        .holder span {
            margin-right: 50px;
        }
    </style>
</head>

<body>
    <canvas id="can"></canvas>
    <div class="holder">
        <div>Score : </div>
        <span class="score">0</span>
        <div>HighScore : </div>
        <span class="high">0</span>
    </div>

    <script src="./snakegame.js"></script>
</body>

</html>
